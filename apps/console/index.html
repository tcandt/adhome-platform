<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="AdHome Console V2 — Nền tảng SaaS quản lý căn hộ dịch vụ và vận hành cơ sở lưu trú." />
    <title>AdHome — Console Quản lý Căn hộ Dịch vụ</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      #adhome-preboot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #FAF9F6;
        color: #0F172A;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        z-index: 99999;
        user-select: none;
      }
      @media (prefers-color-scheme: dark) {
        #adhome-preboot-splash {
          background-color: #0B0F19;
          color: #F8FAFC;
        }
      }
      @keyframes adhome-pulse-glow {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.03); opacity: 1; }
      }
      .adhome-splash-logo {
        animation: adhome-pulse-glow 1.8s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-background text-appText-primary antialiased font-sans transition-colors duration-150">
    <div id="root">
      <div id="adhome-preboot-splash">
        <div class="adhome-splash-logo" style="width: 88px; height: 88px; margin-bottom: 20px;">
          <svg viewBox="4 7 90 82" style="width: 100%; height: 100%; display: block;" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="splash-roof" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#28B7FF" />
                <stop offset="44%" stop-color="#0879FA" />
                <stop offset="100%" stop-color="#0750D8" />
              </linearGradient>
              <linearGradient id="splash-tower" x1="0" y1="0" x2="0.9" y2="1">
                <stop offset="0%" stop-color="#16D2CB" />
                <stop offset="100%" stop-color="#009B9F" />
              </linearGradient>
              <linearGradient id="splash-front" x1="0" y1="0" x2="0.7" y2="1">
                <stop offset="0%" stop-color="#0CCBC4" />
                <stop offset="100%" stop-color="#088C94" />
              </linearGradient>
              <linearGradient id="splash-flow" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#0453D9" />
                <stop offset="42%" stop-color="#058BF3" />
                <stop offset="100%" stop-color="#00C4D8" />
              </linearGradient>
            </defs>
            <path d="M60 14.5C60 9.2 64.7 7.5 68.5 10.3L77.5 17C80.3 19 81 21.3 81 25V71.7C81 76.7 77.5 80.3 72.5 80.3H60V14.5Z" fill="url(#splash-tower)" />

            <rect x="34.5" y="46" width="8.3" height="8.3" rx="2" fill="#FFFFFF" />
            <rect x="45.1" y="46" width="8.3" height="8.3" rx="2" fill="#FFFFFF" />
            <rect x="34.5" y="56.5" width="8.3" height="8.3" rx="2" fill="#FFFFFF" />
            <rect x="45.1" y="56.5" width="8.3" height="8.3" rx="2" fill="#FFFFFF" />

          </svg>
        </div>
        <div style="font-weight: 700; font-size: 20px; letter-spacing: -0.02em; line-height: 1.2;">AdHome</div>
        <div style="font-size: 12px; color: #64748B; margin-top: 5px; font-weight: 500;">Smart Property Management</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

</html>
