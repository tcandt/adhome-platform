        if (!viewport) return;
        const accessibleViewport = 'width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5, user-scalable=yes';
        const resetViewport = () => {
          viewport.setAttribute('content', 'width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no');

            viewport.setAttribute('content', accessibleViewport);
          }));
        };
        resetViewport();
        window.addEventListener('pageshow', resetViewport);
      })();
    </script>
